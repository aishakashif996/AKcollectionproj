<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | AKcollection</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">AKcollection — Admin</div>
        <div class="nav-links">
            <span>Hi, {{ user.full_name }}</span>
            <a href="/products">View Store</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-form">
            <h2>Add New Product</h2>
            <form method="post" action="/admin/products/add" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Product Name" required>
                <textarea name="description" placeholder="Description" rows="3"></textarea>
                <input type="number" step="0.01" name="price" placeholder="Price (Rs.)" required>
                <input type="text" name="category" placeholder="Category (e.g. Handbags, Clutches)">
                <input type="file" name="image" accept="image/*" required>
                <button type="submit" class="btn-gold">Add Product</button>
            </form>
        </div>

        <h1 class="page-title">All Products ({{ products|length }})</h1>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td><img src="/static/assets/{{ product.image_filename }}" alt="{{ product.name }}"></td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.category }}</td>
                    <td>Rs. {{ "%.0f"|format(product.price) }}</td>
                    <td>
                        <form method="post" action="/admin/products/delete/{{ product.id }}" style="display:inline;">
                            <button type="submit" class="btn-delete" onclick="return confirm('Delete this product?');">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
